---
shortcuts: []
state:
  modalVistaEnviarDocumento:  false
bunch:
  onImprimirPresupuestoClicked:
    - _type: download
      schema: presupuestosCli
      params:
        - key: idpresupuesto
          value:
            statePath: presupuesto.buffer.idPresupuesto
      action: presupuesto_to_pdf
      filename:
        const: presupuesto.pdf
      success: none
  # El botón generarPedido ya no despacha aquí: navega a la pantalla de
  # quimera /ventas/aprobar-presupuesto/:id, donde se eligen las cantidades.
  onEnviarEmailClicked:
    - _type: set 
      path: modalVistaEnviarDocumento
      value:
        const: true
  onCancelEnviarEmailClicked:
    - _type: set 
      path: modalVistaEnviarDocumento
      value:
        const: false
  onEmailEnviado:
    - _type: set 
      path: modalVistaEnviarDocumento
      value:
        const: false  

